name: Dump

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'ROM/OTA.zip URL'
        required: true

jobs:
  dump:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-codeql: true
          remove-haskell: true
          remove-docker-images: true

      - name: Set up Git
        uses: actions/checkout@v3

      - name: Create .githubtoken file
        run: echo "${{ secrets.USER_TOKEN }}" > .githubtoken

      - name: Set up environment
        run: bash setup.sh

      - name: Run dumpify
        run: bash dumpify.sh '${{ inputs.urls }}'

      - name: Output results
        if: success()
        run: |
          WORKING_DIR=$(ls -d working/*/ 2>/dev/null | head -1)
          if [ -f "${WORKING_DIR}README.md" ]; then
            echo "## Dump Results" >> $GITHUB_STEP_SUMMARY
            cat "${WORKING_DIR}README.md" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "${WORKING_DIR}fingerprint_entry.txt" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Fingerprint" >> $GITHUB_STEP_SUMMARY
            cat "${WORKING_DIR}fingerprint_entry.txt" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -rf working/ external/ .githubtoken
